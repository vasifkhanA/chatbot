{% load static %}<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive JSON Chatbot</title><link rel="stylesheet" href="{% static 'chatbot/style.css' %}"></head>
<body><main class="app"><section class="chat">
<header><div class="avatar">🤖</div><div><h1>Interactive  Chatbot</h1><p>Sample Django • API</p></div></header>
<div id="messages" class="messages">
<div class="row bot"><div class="bubble">Hello! 👋<br>Ask me something or choose a question below.</div></div>
<div id="suggestions" class="suggestions">
<button data-q="What is Django?">What is Django?</button>
<button data-q="What is Python?">What is Python?</button>
<button data-q="What can you do?">What can you do?</button>
<button data-q="What is this chatbot?">What is this chatbot?</button>
</div></div>
<div id="typing" class="typing hidden">Bot is typing...</div>
<form id="form">{% csrf_token %}<input id="input" placeholder="Type your question..." autocomplete="off"><button>Send</button></form>
</section></main><script src="{% static 'chatbot/app.js' %}"></script></body></html>
